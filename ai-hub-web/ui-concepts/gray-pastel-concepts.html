<style>

6px 0 2px;font-size:8px;color:var(--text)}.app small{display:block;font-size:6px;line-height:1.4;color:var(--muted)}.lower{display:grid;grid-template-columns:1.4fr 1fr;gap:7px;margin-top:7px}.panel{height:66px;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}.panelhead{display:flex;justify-content:space-between;font-size:7px;font-weight:bold;color:var(--text)}.bars{height:34px;display:flex;align-items:end;gap:6px;margin:2px 6px 0;border-bottom:1px solid var(--line)}.bars i{flex:1;border-radius:3px 3px 0 0;background:var(--accent);opacity:.78}.bars i:nth-child(1){height:30%}.bars i:nth-child(2){height:55%}.bars i:nth-child(3){height:42%}.bars i:nth-child(4){height:77%}.bars i:nth-child(5){height:60%}.bars i:nth-child(6){height:90%}.feed{display:flex;gap:5px;align-items:center;margin-top:7px;font-size:6px;color:var(--muted)}.feed i{width:5px;height:5px;border-radius:50%;background:var(--green)}.caption{display:flex;align-items:center;justify-content:space-between;padding:9px 12px}.name{display:flex;align-items:center;gap:8px}.num{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--soft);color:var(--deep);font-size:9px;font-weight:bold}.name h3{margin:0;font-size:11px}.name p{margin:2px 0 0;font-size:7px;color:var(--muted)}.swatches{display:flex;gap:4px}.swatches i{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);background:var(--bg)}.swatches i:nth-child(2){background:var(--surface2)}.swatches i:nth-child(3){background:var(--soft)}.swatches i:nth-child(4){background:var(--accent)}@media(max-width:900px){body{padding:14px}.grid{grid-template-columns:1fr}.head{display:block}.head p{margin-top:8px}}

<body><main class="board"><header class="head"><div><div class="eyebrow">EBS AI HUB · UI EXPLORATION</div><h1>그레이 파스텔 UI 시안</h1></div><p>같은 대시보드 구성 · 포인트 색과 표면 톤 4가지 비교</p></header><section class="grid" id="grid"></section></main>
<template id="screen"><div class="chrome"><span>EBS AI HUB</span><span class="dots"><i></i><i></i><i></i></span></div><div class="screen"><aside class="side"><div class="brand"><span class="mark">✳</span>EBS AI HUB</div><div class="label">WORKSPACE</div><div class="nav on">▦　대시보드</div><div class="nav">▣　설치 앱</div><div class="nav">◈　마켓플레이스</div><div class="nav">♧　사용자 관리</div><div class="nav">♧　알림</div><div class="bottom">설정　·　도움말</div></aside><div class="main"><div class="top"><span>Workspace　/　<b>대시보드</b></span><div class="tools"><span class="search">⌕　앱 검색</span><span>♧</span><span class="avatar">김</span></div></div><div class="welcome"><div><h2>안녕하세요, 관리자님</h2><p>오늘 필요한 앱과 활동을 한눈에 확인하세요.</p></div><span class="date">월요일 · 11월 23일</span></div><div class="stats"><div class="stat"><small>등록된 앱</small><strong>24</strong><em>↗ 지난달보다 3개 증가</em></div><div class="stat"><small>승인 대기</small><strong>03</strong><em>확인이 필요한 요청</em></div><div class="stat"><small>이번 달 이용</small><strong>1,284</strong><em>↗ 12% 증가</em></div></div><div class="rowhead">자주 쓰는 앱 <span>전체 앱 보기　→</span></div><div class="apps"><div class="app"><i>▤</i><b>AI 문서 도우미</b><small>문서 작성과 요약을 도와주는 앱</small></div><div class="app"><i>◷</i><b>일정 관리</b><small>팀 일정과 개인 일정을 한곳에서</small></div><div class="app"><i>▧</i><b>업무 알림</b><small>중요한 업무 변화를 빠르게 확인</small></div></div><div class="lower"><div class="panel"><div class="panelhead"><span>주간 이용 현황</span><span>최근 7일　⌄</span></div><div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i></div></div><div class="panel"><div class="panelhead"><span>최근 활동</span><span>모두 보기</span></div><div class="feed"><i></i>새 앱이 마켓에 등록됐습니다</div><div class="feed"><i></i>가입 승인 요청 3건</div></div></div></div></div></template>
<script>
const concepts=[['lavender','미스트 라벤더','차분한 회색 바탕에 은은한 보라 포인트'],['sage','세이지 그레이','자연스러운 저채도 녹색으로 편안하게'],['blue','파우더 블루','맑은 청회색 포인트로 정보 구분을 또렷하게'],['rose','웜 그레이지','따뜻한 회색과 말린 장미빛으로 부드럽게']];
const grid=document.querySelector('#grid'),template=document.querySelector('#screen');
concepts.forEach(([tone,title,desc],i)=>{const card=document.createElement('article');card.className=`design ${tone}`;card.append(template.content.cloneNode(true));card.insertAdjacentHTML('beforeend',`<footer class="caption"><div class="name"><span class="num">0${i+1}</span><div><h3>${title}</h3><p>${desc}</p></div></div><div class="swatches"><i></i><i></i><i></i><i></i></div></footer>`);grid.append(card)});
</script></body></html>
